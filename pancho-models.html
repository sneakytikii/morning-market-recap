<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pancho Bot — all models</title>
<style>
  :root{--paper:#F4F6F8;--surface:#FFF;--ink:#121821;--ink-2:#4A5566;--ink-3:#57647A;
        --line:#DBDFE7;--accent:#2E5E96;--accent-soft:#E3EAF5;--good:#0A7350;--bad:#B63A2E;}
  @media (prefers-color-scheme:dark){:root{--paper:#0D1219;--surface:#151C25;--ink:#E7EBF1;
        --ink-2:#A4AFBE;--ink-3:#8B97A9;--line:#252F3C;--accent:#7BA7DF;--accent-soft:#1A2634;
        --good:#3DBB89;--bad:#E5776C;}}
  :root[data-theme="dark"]{--paper:#0D1219;--surface:#151C25;--ink:#E7EBF1;--ink-2:#A4AFBE;
        --ink-3:#8B97A9;--line:#252F3C;--accent:#7BA7DF;--accent-soft:#1A2634;--good:#3DBB89;--bad:#E5776C;}
  :root[data-theme="light"]{--paper:#F4F6F8;--surface:#FFF;--ink:#121821;--ink-2:#4A5566;
        --ink-3:#57647A;--line:#DBDFE7;--accent:#2E5E96;--accent-soft:#E3EAF5;--good:#0A7350;--bad:#B63A2E;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
       font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1000px;margin:0 auto;padding:40px 22px 70px}
  h1{font-family:ui-serif,"Iowan Old Style","Source Serif 4",Georgia,serif;
     font-size:34px;font-weight:600;margin:0 0 10px;letter-spacing:-.02em}
  .sub{color:var(--ink-2);margin:0 0 34px;max-width:62ch;font-size:17px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
  .m{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;text-align:center}
  .m.pick{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  canvas{width:168px;height:168px;image-rendering:crisp-edges;image-rendering:pixelated;
         display:block;margin:0 auto 14px}
  .n{font-weight:700;font-size:17px;margin-bottom:3px}
  .tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
       padding:3px 10px;border-radius:99px;margin-bottom:9px}
  .cur{background:var(--accent-soft);color:var(--accent)}
  .no{background:rgba(182,58,46,.13);color:var(--bad)}
  .old{background:rgba(0,0,0,.06);color:var(--ink-3)}
  @media (prefers-color-scheme:dark){.old{background:rgba(255,255,255,.08)}}
  .d{font-size:14.5px;color:var(--ink-2);line-height:1.5}
  .anim{margin-top:36px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
  .anim h2{font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:0 0 16px}
  .frames{display:flex;gap:26px;flex-wrap:wrap;justify-content:center}
  .frames div{text-align:center}
  .frames canvas{width:110px;height:110px;margin-bottom:8px}
  .frames span{font-size:13.5px;color:var(--ink-2);font-weight:600}
</style>
<div class="wrap">
<h1>Pancho Bot — every model</h1>
<p class="sub">Four versions built so far, shown at 5&times; scale. Model D is the one currently
living in the dashboard. Tell me which you want and I&rsquo;ll swap it in.</p>
<div class="grid" id="grid"></div>
<div class="anim">
  <h2>Model D &mdash; animation frames</h2>
  <div class="frames" id="frames"></div>
</div>
</div>
